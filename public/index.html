<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zyte Powered Search</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .search-box { display: flex; max-width: 600px; margin: 0 auto; }
        input { flex-grow: 1; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; background: #3a7bd5; color: white; border: none; cursor: pointer;}
        #results { margin-top: 20px; background: white; color: black; padding: 20px; border-radius: 5px; min-height: 200px; }
    </style>
</head>
<body>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search via Proxy...">
        <button onclick="performSearch()">Search</button>
    </div>

    <!-- The scraped HTML from Zyte will load in this frame -->
    <iframe id="results" style="width:100%; height:80vh; border:none; margin-top: 20px; background: white;"></iframe>

    <script>
        async function performSearch() {
            const query = document.getElementById('searchInput').value;
            const iframe = document.getElementById('results');
            
            // Show loading state
            iframe.srcdoc = "<h3>Loading proxy results through Zyte...</h3>";

            // Call YOUR server, which safely calls Zyte
            const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
            const htmlString = await response.text();

            // Inject the proxy-fetched HTML into the iframe
            iframe.srcdoc = htmlString;
        }
    </script>
</body>
</html>
